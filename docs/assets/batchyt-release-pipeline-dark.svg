      .subtitle { fill: #8b949e; font: 500 15px "JetBrains Mono", "Cascadia Mono", monospace; letter-spacing: .3px; }
      .section { fill: #a78bfa; font: 700 15px "JetBrains Mono", "Cascadia Mono", monospace; letter-spacing: .6px; text-transform: uppercase; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
