---
- name: Show Tresor Index listing summary
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ tresor_index_scheduler_container_name }}"
      - python
      - -m
      - tresor_index.cli
      - listing
      - summary
      - --source
      - "{{ tresor_index_listing_source | default('olx_bucuresti_case_50_1m_eur') }}"
  register: _tresor_index_listing_summary
  changed_when: false

- name: Show Tresor Index listing summary output
  ansible.builtin.debug:
    msg: "{{ _tresor_index_listing_summary.stdout | default('') }}"
