- import_playbook: ../filebrowser/backup-r2.yml
- import_playbook: ../filebrowser-public/backup-r2.yml
- import_playbook: ../grafana/backup-r2.yml
- import_playbook: ../jellyfin/backup-r2.yml
- import_playbook: ../jellyfin-music/backup-r2.yml
- import_playbook: ../kiwix/backup-r2.yml
- import_playbook: ../satelite-watcher/backup-r2.yml
- import_playbook: ../paper/backup-r2.yml
- import_playbook: ../steam-free-notifier/backup-r2.yml
- import_playbook: ../traefik/backup-r2.yml
- import_playbook: ../uptime-kuma/backup-r2.yml
