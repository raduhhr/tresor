---
- name: Ensure Grafana networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ grafana_networks }}"

- name: Ensure Grafana config directory exists
  ansible.builtin.file:
    path: "{{ grafana_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Grafana data directory exists with correct ownership
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"

- name: Ensure Grafana provisioning directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
  loop:
    - "{{ grafana_config_dir }}/provisioning/datasources"
    - "{{ grafana_config_dir }}/provisioning/dashboards"
    - "{{ grafana_config_dir }}/provisioning/dashboards/json"
    - "{{ grafana_config_dir }}/provisioning/plugins"
    - "{{ grafana_config_dir }}/provisioning/alerting"

- name: Remove stale unsupported Grafana piechart plugin
  ansible.builtin.file:
    path: "{{ grafana_data_dir }}/plugins/grafana-piechart-panel"
    state: absent

- name: Find legacy Grafana datasource provisioning files
  ansible.builtin.find:
    paths: "{{ grafana_config_dir }}/provisioning/datasources"
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: _grafana_legacy_datasource_files

- name: Remove legacy Grafana datasource provisioning files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _grafana_legacy_datasource_files.files }}"

- name: Find legacy Grafana dashboard provider files
  ansible.builtin.find:
    paths: "{{ grafana_config_dir }}/provisioning/dashboards"
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
    recurse: false
  register: _grafana_legacy_dashboard_provider_files
  when: grafana_manage_dashboards | bool

- name: Remove legacy Grafana dashboard provider files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _grafana_legacy_dashboard_provider_files.files }}"
  when: grafana_manage_dashboards | bool

- name: Find legacy Grafana dashboard JSON files
  ansible.builtin.find:
    paths: "{{ grafana_config_dir }}/provisioning/dashboards/json"
    patterns:
      - "*.json"
    file_type: file
  register: _grafana_legacy_dashboard_json_files
  when: grafana_manage_dashboards | bool

- name: Remove legacy Grafana dashboard JSON files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _grafana_legacy_dashboard_json_files.files }}"
  when: grafana_manage_dashboards | bool

- name: Render Grafana alerting provisioning
  ansible.builtin.template:
    src: alerting.yml.j2
    dest: "{{ grafana_alerting_file }}"
    owner: "472"
    group: "472"
    mode: "0600"
  register: _grafana_alerting_provisioning
  no_log: true
  when: grafana_alerting_enabled | bool

- name: Remove Grafana alerting provisioning when disabled
  ansible.builtin.file:
    path: "{{ grafana_alerting_file }}"
    state: absent
  register: _grafana_alerting_provisioning_absent
  when: not (grafana_alerting_enabled | bool)

- name: Ensure Grafana Discord alert relay directory exists
  ansible.builtin.file:
    path: "{{ grafana_alerting_relay_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Install Grafana Discord alert relay
  ansible.builtin.copy:
    src: discord_alert_relay.py
    dest: "{{ grafana_alerting_relay_dir }}/discord_alert_relay.py"
    owner: root
    group: root
    mode: "0750"
  register: _grafana_alerting_relay_script
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Render Grafana Discord alert relay environment
  ansible.builtin.template:
    src: discord-alert-relay.env.j2
    dest: "{{ grafana_alerting_relay_env_file }}"
    owner: root
    group: root
    mode: "0600"
  register: _grafana_alerting_relay_env
  no_log: true
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Build Grafana Discord alert relay networks list
  ansible.builtin.set_fact:
    _grafana_alerting_relay_networks_list:
      - name: "lan_pub"
      - name: "internal_net"
        aliases:
          - "{{ grafana_alerting_relay_internal_alias }}"
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Stop legacy host Grafana Discord alert relay
  ansible.builtin.systemd:
    name: "{{ grafana_alerting_relay_service_name }}"
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Run Grafana Discord alert relay container
  community.docker.docker_container:
    name: "{{ grafana_alerting_relay_container_name }}"
    image: "{{ grafana_alerting_relay_image }}"
    pull: true
    recreate: "{{ (_grafana_alerting_relay_script is defined and _grafana_alerting_relay_script is changed) or (_grafana_alerting_relay_env is defined and _grafana_alerting_relay_env is changed) }}"
    restart_policy: unless-stopped
    comparisons:
      networks: strict
    networks: "{{ _grafana_alerting_relay_networks_list }}"
    command: "python /app/discord_alert_relay.py"
    env:
      DISCORD_WEBHOOK_URL: "{{ grafana_alerting_discord_webhook_url }}"
      DISCORD_USER_ID: "{{ grafana_alerting_discord_user_id }}"
      RELAY_TOKEN: "{{ grafana_alerting_relay_token }}"
      LISTEN_HOST: "{{ grafana_alerting_relay_bind_addr }}"
      LISTEN_PORT: "{{ grafana_alerting_relay_port | string }}"
      DISCORD_USERNAME: "{{ grafana_alerting_contact_point_name }}"
    volumes:
      - "{{ grafana_alerting_relay_dir }}/discord_alert_relay.py:/app/discord_alert_relay.py:ro"
    state: started
  no_log: true
  when:
    - grafana_alerting_enabled | bool
    - grafana_alerting_relay_enabled | bool

- name: Disable Grafana Discord alert relay when unused
  ansible.builtin.systemd:
    name: "{{ grafana_alerting_relay_service_name }}"
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when: not (grafana_alerting_enabled | bool and grafana_alerting_relay_enabled | bool)

- name: Remove Grafana Discord alert relay container when unused
  community.docker.docker_container:
    name: "{{ grafana_alerting_relay_container_name }}"
    state: absent
  when: not (grafana_alerting_enabled | bool and grafana_alerting_relay_enabled | bool)

- name: Build Grafana environment variables
  ansible.builtin.set_fact:
    _grafana_env:
      TZ: "{{ grafana_tz }}"
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_SERVER_DOMAIN: "{{ grafana_domain }}"
      GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "{{ grafana_serve_from_sub_path | string | lower }}"
      GF_SECURITY_ALLOW_EMBEDDING: "{{ grafana_allow_embedding | string | lower }}"
      GF_SECURITY_COOKIE_SECURE: "{{ grafana_cookie_secure | string | lower }}"
      GF_SECURITY_COOKIE_SAMESITE: "{{ grafana_cookie_samesite }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
      GF_LOG_MODE: "console file"
      GF_LOG_FILE_MAX_DAYS: "0"
      GF_PLUGINS_PREINSTALL_SYNC: "{{ grafana_install_plugins | join(',') }}"
  no_log: true

- name: Build Grafana networks list
  ansible.builtin.set_fact:
    _grafana_networks_list: "{{ grafana_networks | map('regex_replace', '^(.*)$', '{\"name\": \"\\1\"}') | map('from_yaml') | list }}"

- name: Build Traefik labels (when enabled)
  ansible.builtin.set_fact:
    _grafana_labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`{{ grafana_domain }}`)"
      traefik.http.routers.grafana.entrypoints: "{{ grafana_traefik_entrypoint }}"
      traefik.http.routers.grafana.middlewares: "{{ grafana_traefik_middlewares }}"
      traefik.http.services.grafana.loadbalancer.server.port: "{{ grafana_port | string }}"
  when: grafana_enable_traefik | bool

- name: Build labels (Traefik disabled)
  ansible.builtin.set_fact:
    _grafana_labels:
      traefik.enable: "false"
  when: not (grafana_enable_traefik | bool)

- name: Build published ports list
  ansible.builtin.set_fact:
    _grafana_ports: "{{ [grafana_bind_addr ~ ':' ~ grafana_host_port ~ ':' ~ grafana_port] if grafana_expose_host_port else [] }}"

- name: Resolve Grafana resource limits
  ansible.builtin.set_fact:
    _grafana_resource_limits: "{{ (tresor_container_resource_limits | default({})).get(grafana_container_name, {}) }}"

- name: Run Grafana container
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    image: "{{ grafana_image }}"
    pull: true
    restart_policy: unless-stopped
    comparisons:
      networks: strict
    ports: "{{ _grafana_ports }}"
    networks: "{{ _grafana_networks_list }}"
    etc_hosts: "{{ grafana_extra_hosts }}"
    labels: "{{ _grafana_labels }}"
    env: "{{ _grafana_env }}"
    volumes:
      - "{{ grafana_config_dir }}/provisioning:/etc/grafana/provisioning:ro"
      - "{{ grafana_data_dir }}:/var/lib/grafana"
    user: "{{ grafana_user }}"
    memory: "{{ _grafana_resource_limits.memory | default(omit) }}"
    cpus: "{{ _grafana_resource_limits.cpus | default(omit) }}"
    cpu_shares: "{{ _grafana_resource_limits.cpu_shares | default(omit) }}"
    pids_limit: "{{ _grafana_resource_limits.pids_limit | default(omit) }}"
    state: started

- name: Wait for Grafana container to be running
  community.docker.docker_container_info:
    name: "{{ grafana_container_name }}"
  register: _container_info
  retries: 10
  delay: 2
  until:
    - _container_info.exists
    - _container_info.container.State.Running
  changed_when: false

- name: Wait for Grafana HTTP API to be ready
  ansible.builtin.uri:
    url: "http://{{ grafana_bind_addr }}:{{ grafana_host_port }}/api/health"
    method: GET
    status_code: 200
  register: _grafana_health
  retries: 30
  delay: 2
  until: _grafana_health.status == 200
  changed_when: false

- name: Reload Grafana alerting provisioning
  ansible.builtin.uri:
    url: "http://{{ grafana_bind_addr }}:{{ grafana_host_port }}/api/admin/provisioning/alerting/reload"
    method: POST
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  no_log: true
  when: >-
    (_grafana_alerting_provisioning is defined and _grafana_alerting_provisioning is changed)
    or (_grafana_alerting_provisioning_absent is defined and _grafana_alerting_provisioning_absent is changed)

- name: Reconcile Grafana datasource and dashboards via API
  ansible.builtin.include_tasks: sync_api.yml

- name: Show Grafana deployment summary
  ansible.builtin.debug:
    msg:
      - "Grafana deployed successfully!"
      - "Container: {{ grafana_container_name }}"
      - "Access URL: {{ grafana_root_url }}"
      - "Admin user: {{ grafana_admin_user }}"
      - "Networks: {{ _container_info.container.NetworkSettings.Networks.keys() | list | join(', ') }}"
      - "Traefik: {{ 'enabled' if grafana_enable_traefik else 'disabled (LAN-only)' }}"
      - "Datasources: Prometheus, Tresor Index Postgres (auto-managed via API)"
      - "Alerting: {{ 'Discord contact point + Tresor infra rules enabled' if grafana_alerting_enabled else 'disabled (set grafana_alerting_discord_webhook_url)' }}"
