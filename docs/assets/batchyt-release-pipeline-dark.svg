      <path class="arrow" d="M530 214 H584"/>
      <path class="arrow" d="M794 214 H848"/>
      <path class="arrow" d="M1058 214 H1112"/>

      <text class="section" x="48" y="328">Installed App Update Check</text>
      <rect class="node" x="56" y="358" width="250" height="112"/>
