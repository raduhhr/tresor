---
- name: Deploy Paper (WG-only bind on Tresor, host network mode, locked to VPS WG peer)
  hosts: tresor
  become: true
  gather_facts: false

  vars:
    # Paper settings
    paper_container: "paper"
    paper_uid: 1000
    paper_gid: 1000
    paper_memory: "4G"
    paper_whitelist: "TRUE"
    paper_apply_live: false
    paper_rcon_enable: "FALSE"
    paper_rcon_port: "25575"
    
    # Velocity secret
    velocity_secret: "{{ vault_velocity_forwarding_secret }}"

  roles:
    - role: paper
      vars:
        velocity_forwarding_secret: "{{ velocity_secret }}"
