---
- name: Show latest Tresor Index listings
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ tresor_index_scheduler_container_name }}"
      - python
      - -m
      - tresor_index.cli
      - listing
      - search
      - --source
      - "{{ tresor_index_listing_source | default('olx_bucuresti_case_50_1m_eur') }}"
      - --sort
      - "{{ tresor_index_listing_sort | default('newest') }}"
      - --limit
      - "{{ tresor_index_listing_limit | default(20) | string }}"
  register: _tresor_index_listing_latest
  changed_when: false

- name: Show Tresor Index latest listings
  ansible.builtin.debug:
    msg: "{{ _tresor_index_listing_latest.stdout | default('') }}"
