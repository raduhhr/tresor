  <text class="small" x="602" y="224">Inno Setup Windows</text>
<text class="small" x="602" y="242">installer</text>
      <rect class="node2" x="848" y="166" width="210" height="96"/>
  <text class="label" x="866" y="199">Staging</text>
  <text class="small" x="866" y="224">SSH upload to restricted</text>
<text class="small" x="866" y="242">deploy user</text>
      <rect class="node2" x="1112" y="166" width="210" height="96"/>
  <text class="label" x="1130" y="199">Promote</text>
  <text class="small" x="1130" y="224">installer first, manifest</text>
<text class="small" x="1130" y="242">last, public hash verify</text>
