---
# =====================================================
# Prometheus + Exporters (Bridge Mode - LAN-locked)
# =====================================================

# =====================================================
# 0️⃣ Precheck: Ensure network exists
# =====================================================
- name: Ensure Prometheus network exists
  community.docker.docker_network:
    name: "{{ prometheus_network }}"
    state: present

- name: Ensure Prometheus textfile directory exists
  ansible.builtin.file:
    path: "{{ prometheus_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Prometheus exporters app dir exists
  ansible.builtin.file:
    path: "{{ prometheus_minecraft_metrics_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: prometheus_minecraft_metrics_enabled | bool

- name: Install Minecraft metrics textfile collector
  ansible.builtin.copy:
    src: minecraft_status_textfile.py
    dest: "{{ prometheus_minecraft_metrics_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: prometheus_minecraft_metrics_enabled | bool

- name: Install Minecraft metrics systemd service
  ansible.builtin.template:
    src: minecraft-metrics.service.j2
    dest: "/etc/systemd/system/{{ prometheus_minecraft_metrics_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: prometheus_minecraft_metrics_enabled | bool

- name: Install Minecraft metrics systemd timer
  ansible.builtin.template:
    src: minecraft-metrics.timer.j2
    dest: "/etc/systemd/system/{{ prometheus_minecraft_metrics_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  when: prometheus_minecraft_metrics_enabled | bool

- name: Enable Minecraft metrics timer
  ansible.builtin.systemd:
    name: "{{ prometheus_minecraft_metrics_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when: prometheus_minecraft_metrics_enabled | bool

- name: Run Minecraft metrics collector once
  ansible.builtin.systemd:
    name: "{{ prometheus_minecraft_metrics_service_name }}.service"
    state: started
  when: prometheus_minecraft_metrics_enabled | bool

# =====================================================
# 1️⃣ Node Exporter – host metrics (internal only)
# =====================================================
- name: Run Node Exporter container
  community.docker.docker_container:
    name: node-exporter
    image: "{{ node_exporter_image }}"
    pull: true
    restart_policy: unless-stopped
    hostname: "{{ inventory_hostname }}"  # stable nodename label across restarts
    networks:
      - name: "{{ prometheus_network }}"
    # No published_ports — Prometheus scrapes via internal_net
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - "{{ prometheus_textfile_dir }}:/textfile:ro"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.pressure"
      - "--collector.textfile.directory=/textfile"
    user: "65534:65534"
    read_only: true
    memory: "{{ (tresor_container_resource_limits | default({})).get('node-exporter', {}).memory | default(omit) }}"
    cpus: "{{ (tresor_container_resource_limits | default({})).get('node-exporter', {}).cpus | default(omit) }}"
    cpu_shares: "{{ (tresor_container_resource_limits | default({})).get('node-exporter', {}).cpu_shares | default(omit) }}"
    pids_limit: "{{ (tresor_container_resource_limits | default({})).get('node-exporter', {}).pids_limit | default(omit) }}"
    state: started

# =====================================================
# 2️⃣ cAdvisor – container metrics (internal only)
# =====================================================
- name: Run cAdvisor container
  community.docker.docker_container:
    name: cadvisor
    image: "{{ cadvisor_image }}"
    pull: true
    restart_policy: unless-stopped
    privileged: true  # required: cAdvisor needs host cgroup/proc/disk access (accepted risk)
    networks:
      - name: "{{ prometheus_network }}"
    # No published_ports — Prometheus scrapes via internal_net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--housekeeping_interval=5s"
      - "--docker_only=true"
    devices:
      - /dev/kmsg:/dev/kmsg
    memory: "{{ (tresor_container_resource_limits | default({})).get('cadvisor', {}).memory | default(omit) }}"
    cpus: "{{ (tresor_container_resource_limits | default({})).get('cadvisor', {}).cpus | default(omit) }}"
    cpu_shares: "{{ (tresor_container_resource_limits | default({})).get('cadvisor', {}).cpu_shares | default(omit) }}"
    pids_limit: "{{ (tresor_container_resource_limits | default({})).get('cadvisor', {}).pids_limit | default(omit) }}"
    state: started

# =====================================================
# 3️⃣ Prometheus main service (LAN-locked)
# =====================================================
- name: Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Prometheus data directory exists
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}/data"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"

- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  register: _prom_config
  notify: Restart Prometheus

- name: Run Prometheus container
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image }}"
    pull: true
    restart_policy: unless-stopped
    comparisons:
      networks: strict
    networks: >-
      {{
        [
          {
            'name': (prometheus_network | default('internal_net')),
            'aliases': [prometheus_internal_dns_name | default('prometheus-internal')]
          }
        ]
        + ([{'name': 'lan_pub'}] if (prometheus_expose_host_port | default(true) | bool) else [])
      }}
    published_ports: "{{ [prometheus_bind_addr ~ ':' ~ (prometheus_host_port | string) ~ ':' ~ (prometheus_port | string)] if (prometheus_expose_host_port | default(true) | bool) else omit }}"
    volumes:
      - "{{ prometheus_config_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "{{ prometheus_config_dir }}/data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time={{ prometheus_retention_time }}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.listen-address=0.0.0.0:9090"
      - "--web.enable-lifecycle"
    user: "65534:65534"
    memory: "{{ (tresor_container_resource_limits | default({})).get(prometheus_container_name, {}).memory | default(omit) }}"
    cpus: "{{ (tresor_container_resource_limits | default({})).get(prometheus_container_name, {}).cpus | default(omit) }}"
    cpu_shares: "{{ (tresor_container_resource_limits | default({})).get(prometheus_container_name, {}).cpu_shares | default(omit) }}"
    pids_limit: "{{ (tresor_container_resource_limits | default({})).get(prometheus_container_name, {}).pids_limit | default(omit) }}"
    state: started

# =====================================================
# 5⃣ Firewall note
# =====================================================
# Firewall ownership moved to roles/docker-firewall (playbooks/infra/firewall.yml).
# Run that playbook after deploying Prometheus to apply DOCKER-USER rules.

# =====================================================
# 6️⃣ Verification
# =====================================================
- name: Wait for Prometheus container to be running (internal-only mode)
  community.docker.docker_container_info:
    name: "{{ prometheus_container_name }}"
  register: _prom_info
  retries: 15
  delay: 2
  until:
    - _prom_info.exists
    - _prom_info.container.State.Running
  changed_when: false
  when: not (prometheus_expose_host_port | bool)

- name: Wait for Prometheus to be ready inside the container
  ansible.builtin.command: >
    docker exec {{ prometheus_container_name }}
    wget -q -O- http://localhost:{{ prometheus_port }}/-/ready
  register: _prom_ready
  retries: 20
  delay: 3
  until: _prom_ready.rc == 0 and ('Ready' in _prom_ready.stdout)
  changed_when: false

- name: Check Prometheus published port (best effort)
  ansible.builtin.uri:
    url: "http://{{ prometheus_bind_addr }}:{{ prometheus_host_port }}/-/ready"
    status_code: 200
  register: _prom_ready_published
  changed_when: false
  failed_when: false
  when: prometheus_expose_host_port | bool

- name: Get host IP address
  ansible.builtin.set_fact:
    _host_ip: "{{ prometheus_bind_addr }}"

- name: Show Prometheus deployment summary
  ansible.builtin.debug:
    msg:
      - "✅ Prometheus + exporters deployed successfully!"
      - ""
      - "Exporters (internal only — no host ports):"
      - "  • Node Exporter → internal_net:9100/metrics"
      - "  • cAdvisor → internal_net:8080/metrics"
      - ""
      - "Prometheus (LAN-locked):"
      - "  • Web UI → http://{{ _host_ip }}:{{ prometheus_host_port }}"
      - "  • Targets → http://{{ _host_ip }}:{{ prometheus_host_port }}/targets"
      - ""
      - "Grafana datasource: http://prometheus:9090 ({{ prometheus_network }})"
      - "Published port check: {{ 'ok' if (_prom_ready_published.status | default(0)) == 200 else 'unverified' }}"
