---
- name: Stop steam-free-notifier cron job
  hosts: prod
  become: true
  gather_facts: false

  vars:
    cron_file: /etc/cron.d/steam-free-notifier

  tasks:
    - name: Disable steam-free-notifier cron entry
      ansible.builtin.file:
        path: "{{ cron_file }}"
        state: absent

    - name: Show stop summary
      ansible.builtin.debug:
        msg: "Disabled {{ cron_file }}; app files and state were left in place."
