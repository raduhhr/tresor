---
- name: End host if RA artist notifier is disabled
  ansible.builtin.meta: end_host
  when: not ra_artist_notifier_enabled | bool

- name: Sanity - webhook must be set
  ansible.builtin.assert:
    that:
      - ra_artist_notifier_webhook_url is string
      - ra_artist_notifier_webhook_url | length > 0
      - ra_artist_notifier_webhook_url is match('^https://discord(app)?\\.com/api/webhooks/.+')
    fail_msg: >-
      ra_artist_notifier_webhook_url is missing or invalid.
      Pass it from vault (e.g. vault_ra_artist_notifier_webhook_url).

- name: Ensure dependencies
  ansible.builtin.apt:
    name: "{{ ra_artist_notifier_python_packages }}"
    state: present
    update_cache: true
  when: ra_artist_notifier_manage_packages | bool

- name: Ensure app dir exists
  ansible.builtin.file:
    path: "{{ ra_artist_notifier_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure config dir exists
  ansible.builtin.file:
    path: "{{ ra_artist_notifier_config_dir }}"
    state: directory
    owner: root
    group: "{{ ra_artist_notifier_run_group }}"
    mode: "0770"

- name: Install notifier script
  ansible.builtin.copy:
    src: ra_artist_notifier.py
    dest: "{{ ra_artist_notifier_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Render env file
  ansible.builtin.template:
    src: ra-artist-notifier.env.j2
    dest: "{{ ra_artist_notifier_env_file }}"
    owner: root
    group: "{{ ra_artist_notifier_run_group }}"
    mode: "0640"
  no_log: true

- name: Install systemd service
  ansible.builtin.template:
    src: ra-artist-notifier.service.j2
    dest: "/etc/systemd/system/{{ ra_artist_notifier_service_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Install systemd timer
  ansible.builtin.template:
    src: ra-artist-notifier.timer.j2
    dest: "/etc/systemd/system/{{ ra_artist_notifier_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"

- name: Enable RA artist notifier timer
  ansible.builtin.systemd:
    name: "{{ ra_artist_notifier_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true

- name: Show RA artist notifier summary
  ansible.builtin.debug:
    msg:
      service: "{{ ra_artist_notifier_service_name }}"
      artist: "{{ ra_artist_notifier_artist_name }}"
      artist_url: "{{ ra_artist_notifier_artist_url }}"
      schedule: "{{ ra_artist_notifier_timer_on_calendar }}"
      notify_first_run: "{{ ra_artist_notifier_notify_first_run | bool }}"
