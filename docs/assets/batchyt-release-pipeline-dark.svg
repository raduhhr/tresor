  <text class="small" x="74" y="416">Qt app reads current</text>
<text class="small" x="74" y="434">VERSION and update URL</text>
      <rect class="node" x="372" y="358" width="250" height="112"/>
  <text class="label" x="390" y="391">Compare version</text>
  <text class="small" x="390" y="416">manifest version decides</text>
<text class="small" x="390" y="434">whether update is offered</text>
      <rect class="node" x="688" y="358" width="250" height="112"/>
  <text class="label" x="706" y="391">Download installer</text>
  <text class="small" x="706" y="416">new setup exe lands in</text>
<text class="small" x="706" y="434">temp/app data</text>
      <rect class="node2" x="1004" y="358" width="250" height="112"/>
  <text class="label" x="1022" y="391">Verify + launch</text>
  <text class="small" x="1022" y="416">SHA256 match before silent</text>
<text class="small" x="1022" y="434">installer handoff</text>
      <path class="arrow" d="M306 414 H372"/>
      <path class="arrow" d="M622 414 H688"/>
      <path class="arrow" d="M938 414 H1004"/>

      <text class="section" x="48" y="548">Proof Points</text>
      <rect class="panel" x="56" y="580" width="380" height="86"/>
      <text class="label" x="80" y="615">tag release is gated</text>
      <text class="small" x="80" y="642">workflow refuses VERSION mismatch</text>
      <rect class="panel" x="510" y="580" width="380" height="86"/>
      <text class="label" x="534" y="615">narrow VPS deploy user</text>
      <text class="small" x="534" y="642">staging write + one sudo promote command</text>
      <rect class="panel" x="964" y="580" width="300" height="86"/>
      <text class="label" x="988" y="615">app verifies hash</text>
      <text class="small" x="988" y="642">SHA256 checked before launch</text>
  <line x1="36" y1="758" x2="1364" y2="758" stroke="#30363d" stroke-width="2"/>
  <rect class="footer" x="36" y="772" width="1328" height="28"/>
  <text class="tiny" x="58" y="791" style="letter-spacing:2px">SECOND PASS // PORTFOLIO EVIDENCE</text>
