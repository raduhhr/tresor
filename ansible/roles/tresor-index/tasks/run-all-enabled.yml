---
- name: Run all enabled Tresor Index sources once
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ tresor_index_scheduler_container_name }}"
      - python
      - -m
      - tresor_index.cli
      - run-once
      - --all-enabled
  register: _tresor_index_run_all
  changed_when: false

- name: Show Tresor Index run-all-enabled result
  ansible.builtin.debug:
    msg: "{{ _tresor_index_run_all.stdout }}"
