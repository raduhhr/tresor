---
- name: Run Tresor Index once
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ tresor_index_scheduler_container_name }}"
      - python
      - -m
      - tresor_index.cli
      - run-once
  register: _tresor_index_run_once
  changed_when: false

- name: Show Tresor Index run-once result
  ansible.builtin.debug:
    msg: "{{ _tresor_index_run_once.stdout }}"
