---
- name: List Tresor Index sources
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ tresor_index_scheduler_container_name }}"
      - python
      - -m
      - tresor_index.cli
      - source
      - list
  register: _tresor_index_source_list
  changed_when: false

- name: Show Tresor Index sources
  ansible.builtin.debug:
    msg: "{{ _tresor_index_source_list.stdout | default('') }}"
