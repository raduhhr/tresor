---
- name: Resident Advisor artist notifier status
  hosts: tresor
  become: true
  gather_facts: false

  tasks:
    - name: Check timer state
      ansible.builtin.command: systemctl is-active ra-artist-notifier.timer
      register: _timer_active
      changed_when: false
      failed_when: false

    - name: Check timer enabled state
      ansible.builtin.command: systemctl is-enabled ra-artist-notifier.timer
      register: _timer_enabled
      changed_when: false
      failed_when: false

    - name: Read recent service logs
      ansible.builtin.command: journalctl -u ra-artist-notifier -n 30 --no-pager
      register: _journal
      changed_when: false
      failed_when: false

    - name: Show status summary
      ansible.builtin.debug:
        msg:
          timer_active: "{{ _timer_active.stdout | default('unknown') }}"
          timer_enabled: "{{ _timer_enabled.stdout | default('unknown') }}"
          recent_logs: "{{ _journal.stdout_lines | default([]) }}"
