---
- name: Backup Jellyfin Media (stop -> snapshot -> start)
  hosts: prod
  become: true

  vars:
    backup_dir: "/mnt/data/files/Backups/jellyfin-music"
    container_name: "jellyfin-music"
    backup_excludes:
      - "jellyfin-music/cache"
      - "jellyfin-music/log"
      - "jellyfin-music/metadata"
      - "jellyfin-music/transcodes"
      - "jellyfin-music/migration.xml"
      - "jellyfin-music/config/migration.xml"
      - "jellyfin-music/data/metadata"
      - "jellyfin-music/data/transcodes"
      - "jellyfin-music/root/default/metadata"
      - "jellyfin-music/root/default/transcodes"

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stop Jellyfin Media container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped

    - name: Create compressed snapshot
      ansible.builtin.shell: |
        DATE=$(date +%d%m%Y-%H%M)
        tar \
        {% for item in backup_excludes %}
          --exclude='{{ item }}' \
        {% endfor %}
          -czf "{{ backup_dir }}/jellyfin-music-backup-$DATE.tar.gz" \
          -C /mnt/ssd/configs jellyfin-music
        echo "{{ backup_dir }}/jellyfin-music-backup-$DATE.tar.gz"
      register: _snapshot
      changed_when: true

    - name: Delete snapshots older than 30 days
      ansible.builtin.shell: |
        find "{{ backup_dir }}" -name 'jellyfin-music-backup-*.tar.gz' -mtime +30 -delete
      changed_when: false

    - name: Start Jellyfin Media container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: started

    - name: Log backup
      ansible.builtin.lineinfile:
        path: /var/log/jellyfin-music-backup.log
        line: "[{{ ansible_facts.date_time.iso8601 }}] Snapshot created: {{ _snapshot.stdout }}"
        create: true
        mode: "0644"
