      .label { fill: #e6edf3; font: 700 18px "JetBrains Mono", "Cascadia Mono", monospace; }
      .small { fill: #8b949e; font: 500 13px "JetBrains Mono", "Cascadia Mono", monospace; }
      .tiny { fill: #8b949e; font: 500 11px "JetBrains Mono", "Cascadia Mono", monospace; }
      .ok { fill: #3fb950; font: 700 14px "JetBrains Mono", "Cascadia Mono", monospace; }
      .warn { fill: #f85149; font: 700 14px "JetBrains Mono", "Cascadia Mono", monospace; }
      .accent { fill: #a78bfa; font: 700 14px "JetBrains Mono", "Cascadia Mono", monospace; }
      .arrow { fill: none; stroke: #a78bfa; stroke-width: 3; marker-end: url(#arrow-dark); }
      .dash { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 8 9; }
      .footer { fill: #161b22; stroke: #30363d; stroke-width: 2; }
