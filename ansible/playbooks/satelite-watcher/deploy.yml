---
- name: Deploy Satelite watcher and recorder
  hosts: tresor
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert Debian family
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook currently targets Debian hosts."

  roles:
    - role: satelite_watcher
      tags: [satelite_watcher]
