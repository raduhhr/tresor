---
- name: Start Satelite watcher
  hosts: tresor
  become: true
  gather_facts: false

  tasks:
    - name: Enable and start Satelite watcher timer
      ansible.builtin.systemd:
        name: satelite-watcher-schedule.timer
        enabled: true
        state: started

    - name: Trigger immediate Satelite Watcher schedule refresh
      ansible.builtin.command: systemctl start satelite-watcher-schedule.service
      changed_when: true

    - name: Show status after start
      ansible.builtin.debug:
        msg: "Satelite watcher timer started and schedule refresh triggered."
