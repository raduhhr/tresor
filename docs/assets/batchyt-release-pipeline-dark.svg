  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="36" y="58">BatchYT Downloader // release + update pipeline</text>
  <text class="subtitle" x="36" y="88">Tag-driven GitHub Actions release, installer manifest, restricted VPS promotion, SHA256-verified updater</text>
  
      <text class="section" x="48" y="136">GitHub Release Path</text>
      <rect class="node" x="56" y="166" width="210" height="96"/>
  <text class="label" x="74" y="199">v-tag push</text>
